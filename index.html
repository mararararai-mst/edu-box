/* ── カテゴリ・章の定義 ── */
const CATEGORIES = {
  chu1:   {label:"🌱 中1理科",                          cls:"cat-chu1"},
  chu2:   {label:"🧪 中2理科",                          cls:"cat-chu2"},
  chu3:   {label:"⚗️ 中3理科",                          cls:"cat-chu3"},
  elem:   {label:"🎒 小学校・支援",                      cls:"cat-elem"},
  social: {label:"🏛️ 社会・公民",                       cls:"cat-social"},
  rec:    {label:"🎉 レク・あそび",                      cls:"cat-rec"},
  kokoro: {label:"💗 心・ふりかえり（学級経営／自己調整）",   cls:"cat-kokoro"},
  design: {label:"🎨 授業デザイン系（教師が授業設計に使う）", cls:"cat-design"},
  maps:   {label:"📊 まとめマップ",                      cls:"cat-ks"},
  school: {label:"📖 学校運営系（教師全体向け）",          cls:"cat-school"},
  tech:   {label:"🔧 技術・ものづくり",                   cls:"cat-tech"},
};

const CHAPTERS = {
  plant:  {icon:"🌱", label:"中1 ／ 生物2章「植物の分類」",        pages:"P.31〜44", color:"#c8961e", bg:"#fff8e8"},
  animal: {icon:"🐾", label:"中1 ／ 生物3章「動物の分類」",        pages:"P.46〜57", color:"#2E7D32", bg:"#f0fff4"},
  chem2:  {icon:"🧪", label:"中2 ／ 化学1章「化学変化と原子・分子」", pages:"P.32〜",  color:"#d63384", bg:"#fff0f5"},
};

const BADGE_CLS = {
  "生物":"bio", "化学":"chem", "物理":"phys", "地学":"earth",
  "支援":"other", "算数":"other", "レク":"other", "幼児":"other", "社会":"social", "技術":"other",
};

const NEW_DAYS = 21;

/* ── 状態 ── */
const state = { cat: null, badge: null, q: "" };
const openChapters = new Set();

function isNew(it){
  return (Date.now() - new Date(it.added + "T00:00:00")) < NEW_DAYS * 86400000;
}

function matches(it){
  if (state.badge && it.badge !== state.badge) return false;
  const q = state.q.trim().toLowerCase();
  if (q) {
    const hay = [it.title, it.desc, it.words, it.meta, it.badge].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function cardHTML(it){
  const cls = it.badge ? BADGE_CLS[it.badge] : "";
  return `<a class="card${cls ? " field-" + cls : ""}" href="${it.href}" target="_blank">` +
    (isNew(it) ? `<span class="new-badge">NEW</span>` : "") +
    `<div class="icon">${it.icon}</div>` +
    `<div class="title">${it.title}</div>` +
    (it.desc ? `<div class="desc">${it.desc}</div>` : "") +
    (it.words ? `<div class="words">${it.words}</div>` : "") +
    (it.badge ? `<span class="field-badge ${cls}" data-badge="${it.badge}" title="「${it.badge}」で絞り込む">${it.badge}</span>` : "") +
    `<span class="meta">${it.meta}</span>` +
    `</a>`;
}

function render(){
  const searching = state.q.trim() !== "" || state.badge !== null;
  let html = "";

  for (const [key, cat] of Object.entries(CATEGORIES)) {
    if (state.cat && state.cat !== key) continue;
    const visible = ITEMS.filter(i => i.cat === key && matches(i));
    if (visible.length === 0) continue;
    const total = ITEMS.filter(i => i.cat === key).length;

    html += `<div class="category ${cat.cls}">`;
    html += `<div class="category-title${state.cat === key ? " active" : ""}" data-cat="${key}" tabindex="0" role="button">${cat.label}（${total}）</div>`;

    if (key === "maps") {
      for (const [ck, ch] of Object.entries(CHAPTERS)) {
        const chVisible = visible.filter(i => i.chapter === ck);
        if (chVisible.length === 0) continue;
        const chTotal = ITEMS.filter(i => i.cat === "maps" && i.chapter === ck).length;
        const open = searching || openChapters.has(ck);
        html += `<div class="chapter-band" data-ch="${ck}" tabindex="0" role="button" style="border-left-color:${ch.color};background:${ch.bg}">` +
          `<span class="tri">${open ? "▾" : "▸"}</span>${ch.icon} <strong>${ch.label}</strong> <span class="count">（${ch.pages} ／ 全${chTotal}マップ）</span></div>`;
        if (open) html += `<div class="cards">${chVisible.map(cardHTML).join("")}</div>`;
      }
    } else {
      html += `<div class="cards">${visible.map(cardHTML).join("")}</div>`;
    }
    html += `</div>`;
  }

  if (!html) html = `<div class="no-hit">😢 見つかりませんでした。キーワードを変えてみてね</div>`;
  document.getElementById("content").innerHTML = html;
  document.body.classList.toggle("filtered", state.cat !== null);
  renderFilterChip();
}

function renderFilterChip(){
  const el = document.getElementById("active-filter");
  el.innerHTML = state.badge
    ? `<span class="chip">絞り込み中：${state.badge}<button type="button" id="clear-badge" aria-label="絞り込み解除">✕</button></span>`
    : "";
}

function renderFooter(){
  const apps = ITEMS.filter(i => i.cat !== "maps").length;
  const maps = ITEMS.filter(i => i.cat === "maps").length;
  const last = ITEMS.map(i => i.added).sort().pop();
  document.getElementById("footer").textContent =
    `最終更新：${last} ／ 教材・アプリ ${apps}件＋まとめマップ ${maps}件`;
}

/* ── イベント（デリゲーション） ── */
function handleActivate(target, e){
  const badge = target.closest(".field-badge");
  if (badge) {
    e.preventDefault();
    e.stopPropagation();
    state.badge = (state.badge === badge.dataset.badge) ? null : badge.dataset.badge;
    render();
    return;
  }
  const band = target.closest(".chapter-band");
  if (band) {
    const ck = band.dataset.ch;
    openChapters.has(ck) ? openChapters.delete(ck) : openChapters.add(ck);
    render();
    return;
  }
  const title = target.closest(".category-title");
  if (title) {
    const key = title.dataset.cat;
    state.cat = (state.cat === key) ? null : key;
    render();
    if (state.cat) {
      const el = document.querySelector(".category-title.active");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
}

document.getElementById("content").addEventListener("click", e => handleActivate(e.target, e));
document.getElementById("content").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    if (e.target.matches(".category-title, .chapter-band")) {
      e.preventDefault();
      handleActivate(e.target, e);
    }
  }
});
document.getElementById("active-filter").addEventListener("click", e => {
  if (e.target.id === "clear-badge") { state.badge = null; render(); }
});
document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value;
  render();
});

renderFooter();
render();
</script>
