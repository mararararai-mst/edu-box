/* ── 分野（入り口）── */
const RIKA = ["生物", "化学", "物理", "地学"];
const FIELDS = RIKA.concat(["保健"]);   /* 入り口タイルに並ぶ分野（理科4分野＋保健） */
const FCOL = {
  "生物":"#2E7D32", "化学":"#D63384", "物理":"#1565C0", "地学":"#E07A1A", "保健":"#C62828",
  "算数":"#6A4FB1", "社会":"#00796B", "支援":"#7A5AA8", "レク":"#C05F00",
  "国語":"#B03A6B", "幼児":"#B27900", "技術":"#4A5560"
};
const NEUTRAL = "#A6957F";

/* ── 「そのほか」の中の区分 ── */
const CATNM = {
  elem:"小学校・支援", social:"社会・公民", rec:"レク・あそび", tech:"技術・ものづくり",
  design:"授業デザイン（教師が授業設計に使う）", kokoro:"心・ふりかえり（学級経営／自己調整）",
  school:"学校運営（教師全体向け）",
  chu1:"中1理科", chu2:"中2理科", chu3:"中3理科", hoken:"中3保健", maps:"まとめマップ"
};
const CATCOL = {
  elem:"#6A4FB1", social:"#00796B", rec:"#C05F00", tech:"#4A5560",
  design:"#2E7D32", kokoro:"#B03A6B", school:"#1565C0",
  chu1:"#B57E00", chu2:"#2E7D32", chu3:"#D63384", hoken:"#C62828", maps:"#B27900"
};
const OTHER_ORDER_BASE = ["elem", "social", "rec", "tech", "design", "kokoro", "school"];

/* ── まとめマップの章 ── */
const CHAPTERS = {
  intro:   {label:"まとめマップって？（はじめに）",        pages:""},
  plant:   {label:"中1 ／ 生物2章「植物の分類」",         pages:"P.31〜44"},
  animal:  {label:"中1 ／ 生物3章「動物の分類」",         pages:"P.46〜57"},
  chem2:   {label:"中2 ／ 化学1章「化学変化と原子・分子」", pages:"P.32〜71"},
  bio2cell:{label:"中2 ／ 生物1章「生物と細胞」",         pages:"P.94〜103"},
  hoken3:  {label:"中3 ／ 保健6章「健康と環境」",         pages:"P.170〜183"}
};

const NEW_DAYS = 21;
const state = { view: "entry", pick: null, q: "" };
const openChapters = new Set();

const col = b => FCOL[b] || NEUTRAL;
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const isNew = it => it.added && (Date.now() - new Date(it.added + "T00:00:00")) < NEW_DAYS * 86400000;
/* intro の章（まとめマップの入口）は各分野のまとめマップに出すので、「そのほか」には入れない */
const OTHERS = () => ITEMS.filter(i => !FIELDS.includes(i.badge) && i.chapter !== "intro");
const cnt = f => ITEMS.filter(i => i.badge === f).length;

function cardHTML(it) {
  const nw = isNew(it);
  return '<a class="c' + (nw ? ' is-new' : '') + '" href="' + esc(it.href) + '" target="_blank" rel="noopener">'
    + '<div class="bar" style="background:' + col(it.badge) + '"></div>'
    + '<div class="in">'
    + '<div class="ti">' + esc(it.title) + '</div>'
    + (it.desc ? '<div class="de">' + esc(it.desc) + '</div>' : '')
    + (it.words ? '<div class="wd">' + esc(it.words) + '</div>' : '')
    + '<div class="me">' + (nw ? '<span class="nw">NEW</span>' : '') + esc(it.meta) + '</div>'
    + '</div></a>';
}
function gridHTML(list) {
  return '<div class="grid">' + list.map(cardHTML).join("") + '</div>';
}
function sectionHTML(label, sq, list, inner, id) {
  if (!list.length) return '';
  return '<div class="cat"' + (id ? ' id="' + id + '"' : '') + '>'
    + '<div class="cat-h"><div class="sq" style="background:' + sq + '"></div>'
    + '<div class="nm">' + esc(label) + '</div><div class="ct">' + list.length + '</div></div>'
    + (inner || gridHTML(list)) + '</div>';
}

/* 区分が2つ以上あるときは、上に「跳ぶ」ボタンを並べる */
function sectionsHTML(secs) {
  const live = secs.filter(x => x.list.length);
  const jumps = live.length < 2 ? '' :
    '<div class="jumps">' + live.map(x =>
      '<button class="jump" data-to="' + x.id + '">'
      + '<span class="jq" style="background:' + x.col + '"></span>'
      + '<span>' + esc(x.label) + '</span><span class="jc">' + x.list.length + '</span></button>'
    ).join("") + '</div>';
  return jumps + live.map(x => sectionHTML(x.label, x.col, x.list, x.inner, x.id)).join("");
}

/* まとめマップは章ごとに折りたためる */
function mapsInnerHTML(list, forceOpen) {
  const order = Object.keys(CHAPTERS)
    .concat([...new Set(list.map(i => i.chapter))].filter(c => c && !CHAPTERS[c]));
  let html = "";
  order.forEach(ck => {
    const sub = list.filter(i => i.chapter === ck);
    if (!sub.length) return;
    const ch = CHAPTERS[ck] || { label: ck, pages: "" };
    const open = forceOpen || openChapters.has(ck);
    html += '<button class="band" data-ch="' + esc(ck) + '">'
      + '<span class="tri">' + (open ? "▾" : "▸") + '</span>'
      + '<span>' + esc(ch.label) + '</span>'
      + '<span class="bc">' + esc(ch.pages) + (ch.pages ? ' ／ ' : '') + '全' + sub.length + 'マップ</span>'
      + '</button>'
      + (open ? gridHTML(sub) : '');
  });
  const rest = list.filter(i => !i.chapter);
  if (rest.length) html += gridHTML(rest);
  return html;
}

/* ── 画面 ── */
function topHTML(searching) {
  /* 検索中は、元の画面の見出し（例「そのほか 19件」）を出さない。
     検索結果側にも見出しが出るため、二重になって今どこかが分からなくなる */
  if (searching) {
    return state.view === "entry" ? ''
      : '<button class="back" id="back">← 入り口にもどる</button>';
  }
  if (state.view === "entry") {
    return '<div class="hd"><h1>教材ボックス</h1>'
      + '<div class="sub">アイデアをカタチに。</div>'
      + '<div class="note">校務PCで使うときは このHTMLをダウンロードして開いてね</div></div>';
  }
  const nm = state.view === "other" ? "そのほか" : state.pick;
  const n = state.view === "other" ? OTHERS().length : cnt(state.pick);
  const c = state.view === "other" ? "#5C4F42" : col(state.pick);
  return '<button class="back" id="back">← 入り口にもどる</button>'
    + '<div class="now" style="color:' + c + '">' + esc(nm) + '　' + n + '件</div>';
}

function entryHTML() {
  const tiles = FIELDS.map(f => {
    const n = cnt(f);
    if (!n) return '<div class="tile empty"><div class="tn">' + f + '</div><div class="tc">準備中</div></div>';
    return '<button class="tile" data-f="' + f + '" style="background:' + FCOL[f] + '">'
      + '<div class="tn">' + f + '</div><div class="tc">' + n + ' 件</div></button>';
  }).join("");
  const o = OTHERS();
  const names = OTHER_ORDER_BASE.filter(c => o.some(i => i.cat === c))
    .map(c => (CATNM[c] || c).replace(/（.*$/, "")).slice(0, 3).join("／");
  return '<div class="tiles">' + tiles + '</div>'
    + '<button class="other" data-f="__other"><div class="tn">そのほか</div>'
    + '<div class="tc">' + o.length + ' 件（' + esc(names) + ' ほか）</div></button>';
}

function fieldHTML() {
  const list = ITEMS.filter(i => i.badge === state.pick);
  const own = list.filter(i => i.cat === "maps");
  /* まとめマップがある分野では、先頭に intro の章（入口）もつける */
  const maps = own.length ? ITEMS.filter(i => i.chapter === "intro").concat(own) : own;
  return sectionsHTML([
    { id:"sec-apps", label:"アプリ・教材", col:col(state.pick), list:list.filter(i => i.cat !== "maps") },
    { id:"sec-maps", label:"まとめマップ", col:CATCOL.maps, list:maps, inner:mapsInnerHTML(maps, false) }
  ]);
}

function otherHTML() {
  const list = OTHERS();
  const order = OTHER_ORDER_BASE
    .concat([...new Set(list.map(i => i.cat))].filter(c => !OTHER_ORDER_BASE.includes(c)));
  return sectionsHTML(order.map(c => ({
    id: "sec-" + c, label: CATNM[c] || c, col: CATCOL[c] || NEUTRAL,
    list: list.filter(i => i.cat === c)
  })));
}

function searchHTML() {
  const q = state.q.trim().toLowerCase();
  const hit = ITEMS.filter(it =>
    [it.title, it.desc, it.words, it.meta, it.badge].join(" ").toLowerCase().includes(q));
  if (!hit.length) {
    return '<div class="no-hit">「' + esc(state.q) + '」は見つかりませんでした。<br>キーワードを変えてみてください。</div>';
  }
  const groups = FIELDS.concat(["__other"]);
  return '<div class="now" style="color:#5C4F42;margin-bottom:22px">検索結果　' + hit.length + '件<br>'
    + '<span style="font-size:13px;font-weight:500;color:#6E6053">分野を問わず、全' + ITEMS.length + '件の中から探しています</span></div>'
    + groups.map(g => {
        const sub = g === "__other" ? hit.filter(i => !FIELDS.includes(i.badge)) : hit.filter(i => i.badge === g);
        return sectionHTML(g === "__other" ? "そのほか" : g, g === "__other" ? NEUTRAL : FCOL[g], sub);
      }).join("");
}

function render() {
  const searching = state.q.trim() !== "";
  document.getElementById("top").innerHTML = topHTML(searching);
  document.getElementById("app").innerHTML =
    searching ? searchHTML()
    : state.view === "entry" ? entryHTML()
    : state.view === "other" ? otherHTML()
    : fieldHTML();
  const b = document.getElementById("back");
  if (b) b.onclick = () => { state.view = "entry"; state.pick = null; render(); window.scrollTo(0, 0); };
  padForJumps();
}

/* いちばん下の区分も画面の上まで来られるように、
   足りない分だけ最後の区分の下に余白を足す（余らせない） */
function padForJumps() {
  const secs = document.querySelectorAll("#app .cat");
  if (!secs.length) return;
  const last = secs[secs.length - 1];
  last.style.paddingBottom = "";
  if (!document.querySelector("#app .jumps")) return;
  const docH = document.documentElement.scrollHeight;
  const lastTop = last.getBoundingClientRect().top + window.scrollY;
  const need = Math.round(window.innerHeight - (docH - lastTop) - 24);
  if (need > 0) last.style.paddingBottom = need + "px";
}

/* 区分へ跳ぶ。なめらかスクロールが効かない環境（アニメーションが
   止められている等）では黙って動かないので、少し待って一気に飛ばす */
/* 区分へ跳ぶ。なめらかスクロールは環境によって効かない・途中で止まる
   ことがあるため、確実に着く即時スクロールにしている */
function jumpTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  const target = Math.max(0, Math.min(el.getBoundingClientRect().top + window.scrollY - 12, max));
  window.scrollTo(0, target);
}

function renderFooter() {
  const apps = ITEMS.filter(i => i.cat !== "maps").length;
  const maps = ITEMS.filter(i => i.cat === "maps").length;
  const last = ITEMS.map(i => i.added).filter(Boolean).sort().pop();
  document.getElementById("footer").textContent =
    "最終更新：" + last + " ／ 教材・アプリ " + apps + "件＋まとめマップ " + maps + "件";
}

/* ── 操作 ── */
document.getElementById("app").addEventListener("click", e => {
  const tile = e.target.closest("[data-f]");
  if (tile) {
    const f = tile.dataset.f;
    state.view = (f === "__other") ? "other" : "field";
    state.pick = (f === "__other") ? null : f;
    render();
    window.scrollTo(0, 0);
    return;
  }
  const jump = e.target.closest(".jump");
  if (jump) { jumpTo(jump.dataset.to); return; }
  const band = e.target.closest(".band");
  if (band) {
    const ck = band.dataset.ch;
    openChapters.has(ck) ? openChapters.delete(ck) : openChapters.add(ck);
    render();
  }
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });

renderFooter();
render();
</script>
